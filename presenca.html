<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Espalhe Presença</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#4b2c20,#7b4b32);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{

max-width:420px;
width:100%;

background:rgba(255,255,255,.1);

backdrop-filter:blur(8px);

padding:25px;

border-radius:25px;

text-align:center;

box-shadow:0 0 20px rgba(0,0,0,.3);

}

h1{

font-size:32px;
margin-bottom:10px;

}

.sub{

opacity:.9;
margin-bottom:25px;

}

.card{

background:white;
color:#5c3a2d;

padding:20px;

border-radius:20px;

margin:20px 0;

min-height:100px;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

}

button{

width:100%;

padding:15px;

margin-top:10px;

border:none;

border-radius:15px;

font-size:18px;

cursor:pointer;

background:#ffca7a;

}

input,textarea{

width:100%;

padding:12px;

margin-top:10px;

border:none;

border-radius:10px;

box-sizing:border-box;

}

.contador{

margin-top:20px;

opacity:.8;

}

</style>
</head>

<body>

<div class="container">

<h1>🍫 Nos ajude a adoçar o mundo</h1>

<div class="sub">

Cada mensagem pode encontrar alguém no momento certo ✨

</div>

<div class="card" id="mensagem">

Clique abaixo para receber uma presença

</div>

<button onclick="receberMensagem()">

Receber uma Presença ❤️

</button>

<input id="nome" placeholder="Seu nome (opcional)">

<textarea id="texto"
placeholder="Deixe uma presença para alguém...">
</textarea>

<button onclick="salvarMensagem()">

Espalhar Presença 🍫

</button>

<div class="contador">

<span id="total">0</span> presenças espalhadas ✨

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";

import {

getDatabase,
ref,
push,
get,
child

} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";


const firebaseConfig = {

/* cole seu config */

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

async function receberMensagem(){

const snapshot =
await get(ref(db,"presencas"));

if(!snapshot.exists()) return;

const dados =
Object.values(snapshot.val());

const aleatoria =
dados[Math.floor(
Math.random()*dados.length
)];

document.getElementById(
"mensagem"
).innerHTML =

`"${aleatoria.texto}" 
<br><br>
✨ ${aleatoria.nome || "Alguém"}`;

}

window.receberMensagem =
receberMensagem;

async function salvarMensagem(){

const nome =
document.getElementById("nome").value;

const texto =
document.getElementById("texto").value;

if(!texto) return;

await push(
ref(db,"presencas"),
{
nome,
texto,
data:Date.now()
}
);

document.getElementById(
"texto"
).value="";

document.getElementById(
"nome"
).value="";

alert("Presença espalhada 🍫");

carregarTotal();

}

window.salvarMensagem =
salvarMensagem;

async function carregarTotal(){

const snap =
await get(ref(db,"presencas"));

if(!snap.exists()) return;

document.getElementById(
"total"
).innerText =

Object.keys(
snap.val()
).length;

}

carregarTotal();

</script>

</body>
</html>
