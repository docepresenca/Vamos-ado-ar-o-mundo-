<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Doce Presença</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;600&display=swap"
rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

font-family:
'Montserrat',
sans-serif;

min-height:100vh;

background-image:

linear-gradient(
rgba(40,20,10,.45),
rgba(40,20,10,.55)
),

url("imagem.png");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

color:white;

}

.container{

width:100%;

max-width:430px;

background:
rgba(255,255,255,.10);

backdrop-filter:blur(14px);

padding:32px 24px;

border-radius:32px;

box-shadow:

0 15px 40px rgba(0,0,0,.35);

text-align:center;

}

.logo{

font-size:18px;

letter-spacing:3px;

opacity:.8;

margin-bottom:10px;

}

h1{

font-family:
'Cormorant Garamond',
serif;

font-size:52px;

font-weight:600;

line-height:1;

margin-bottom:15px;

}

.sub{

line-height:1.7;

font-size:15px;

opacity:.9;

margin-bottom:28px;

}

.card{

background-image:
url("imagem.msg.png");

background-size:cover;

background-position:center;

min-height:290px;

border-radius:26px;

padding:35px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

box-shadow:
0 10px 35px rgba(0,0,0,.2);

margin-bottom:18px;

}

#mensagem{

font-family:
'Cormorant Garamond',
serif;

font-size:29px;

line-height:1.4;

color:#4c2e1f;

}

.likes{

margin-top:20px;

font-size:14px;

color:#5a3929;

}

.row{

display:flex;

gap:10px;

margin-top:15px;

width:100%;

}

button,
.btn{

width:100%;

border:none;

padding:16px;

margin-top:12px;

border-radius:18px;

font-weight:600;

font-size:15px;

cursor:pointer;

}

.principal{

background:#e7b56f;

color:#4a2d1e;

}

.sec{

background:rgba(255,255,255,.92);

}

.instagram{

display:block;

text-decoration:none;

background:#7d4f34;

color:white;

}

.contador{

margin-top:20px;

opacity:.8;

}

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.75);

justify-content:center;

align-items:center;

padding:20px;

z-index:999;

}

.box{

width:100%;

max-width:380px;

background:#fff7f1;

color:#4d2d1d;

padding:25px;

border-radius:26px;

}

input,
textarea{

width:100%;

padding:14px;

margin-top:12px;

border-radius:14px;

border:1px solid #ddd;

}

textarea{

height:120px;

resize:none;

}

.preview{

display:none;

}

.preview img{

width:100%;

border-radius:20px;

margin-top:20px;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

DOCE PRESENÇA

</div>

<h1>

Nos ajude a adoçar o mundo

</h1>

<div class="sub">

Quando a Doce Presença chega o amargo do mundo vai embora ✨

</div>

<div class="card">

<div id="mensagem">

Carregando presença...

</div>

<div
class="likes"
id="likes">

❤️ 0 curtidas

</div>

<div class="row">

<button
class="principal"
onclick="curtirMensagem()">

❤️ Curtir

</button>

<button
class="sec"
onclick="gerarImagem()">

🖼️ Virar imagem

</button>

</div>

</div>

<button
class="principal"
onclick="receberMensagem()">

🍯 Adoce seu dia

</button>

<button
class="sec"
onclick="abrirModal()">

🤎 Adoce o dia de alguém

</button>

<a
class="btn instagram"
target="_blank"
href="https://www.instagram.com/doce.presenca.doces?igsh=MWVvcW44bmZ6bXZpdQ==">

✨ Conhecer nosso Instagram

</a>

<div class="contador">

<span id="total">

0

</span>

presenças espalhadas ✨

</div>

</div>

<!-- modal mensagem -->

<div
class="modal"
id="modal">

<div class="box">

<input
id="nome"
placeholder="Nome opcional">

<input
id="cidade"
placeholder="Cidade opcional">

<textarea
id="texto"
placeholder="Escreva sua presença">

</textarea>

<button
class="principal"
onclick="salvarMensagem()">

Compartilhar no site

</button>

<button
class="sec"
onclick="compartilharWhats()">

WhatsApp

</button>

</div>

</div>

<!-- modal preview -->

<div
class="modal"
id="previewModal">

<div class="box preview">

<img id="previewImg">

<button
class="principal"
onclick="baixarImagem()">

Salvar imagem

</button>

</div>

</div>

<script>

/* usa seu JS firebase atual */

/* alterar somente gerarImagem */

let imgGerada="";

function gerarImagem(){

const canvas=
document.createElement("canvas");

canvas.width=1080;

canvas.height=1920;

const ctx=
canvas.getContext("2d");

ctx.fillStyle="#6d432b";

ctx.fillRect(
0,
0,
1080,
1920
);

ctx.fillStyle="#fff6ef";

ctx.fillRect(
90,
320,
900,
1000
);

ctx.fillStyle="#4f3122";

ctx.font="60px serif";

ctx.fillText(

document.getElementById(
"mensagem"
).innerText,

130,

600

);

ctx.font="42px serif";

ctx.fillText(

"@doce.presenca.doces",

250,

1200

);

imgGerada=
canvas.toDataURL();

previewImg.src=
imgGerada;

previewModal.style.display=
"flex";

}

function baixarImagem(){

const a=
document.createElement("a");

a.href=
imgGerada;

a.download=
"presenca.png";

a.click();

}

previewModal.onclick=
(e)=>{

if(e.target===previewModal)

previewModal.style.display=
"none";

};

</script>

</body>

</html>
