<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doce Presença</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

font-family:Arial,sans-serif;

background:
linear-gradient(
180deg,
#4b2c20,
#6f422a,
#9f6b46
);

min-height:100vh;

padding:20px;

display:flex;

justify-content:center;

align-items:center;

color:white;

}

.container{

width:100%;

max-width:430px;

background:
rgba(255,255,255,.10);

backdrop-filter:blur(12px);

padding:25px;

border-radius:28px;

box-shadow:
0 10px 35px rgba(0,0,0,.35);

text-align:center;

}

h1{

font-size:34px;

margin-bottom:12px;

}

.sub{

line-height:1.6;

opacity:.9;

margin-bottom:25px;

font-style:italic;

}

.card{

background:white;

color:#5c3a2d;

padding:25px;

border-radius:22px;

min-height:180px;

display:flex;

justify-content:center;

align-items:center;

font-size:20px;

line-height:1.6;

margin-bottom:20px;

}

.btn{

width:100%;

padding:15px;

margin-top:12px;

border:none;

border-radius:16px;

font-size:17px;

font-weight:bold;

cursor:pointer;

}

.principal{

background:#ffca7a;

}

.sec{

background:#ffffff;

color:#6f422a;

}

.instagram{

background:#8d5837;

color:white;

text-decoration:none;

display:block;

}

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.65);

justify-content:center;

align-items:center;

padding:20px;

}

.box{

background:white;

width:100%;

max-width:360px;

padding:25px;

border-radius:20px;

color:#5c3a2d;

}

input,
textarea{

width:100%;

padding:12px;

margin-top:10px;

border-radius:12px;

border:1px solid #ddd;

}

textarea{

height:120px;

resize:none;

}

.contador{

margin-top:20px;

opacity:.8;

}

.footer{

margin-top:20px;

font-size:12px;

opacity:.7;

}

</style>

</head>

<body>

<div class="container">

<h1>

🍫 Nos ajude a adoçar o mundo

</h1>

<div class="sub">

"Quando a Doce Presença chega o amargo do mundo vai embora"

</div>

<div
class="card"
id="mensagem">

Carregando presença...

</div>

<button
class="btn principal"
onclick="receberMensagem()">

🍯 Adoce seu dia

</button>

<button
class="btn sec"
onclick="abrirModal()">

🤎 Adoce o dia de alguém

</button>

<a
class="btn instagram"
href="https://www.instagram.com/doce.presenca.doces?igsh=MWVvcW44bmZ6bXZpdQ=="
target="_blank">

✨ Conhecer nosso Instagram

</a>

<div class="contador">

<span id="total">

0

</span>

presenças espalhadas ✨

</div>

<div class="footer">

Doce Presença • pequenos encontros, grandes significados

</div>

</div>


<!-- MODAL -->

<div
class="modal"
id="modal">

<div class="box">

<h3>

Compartilhar presença 🤎

</h3>

<input
id="nome"
placeholder="Nome (opcional)">

<input
id="cidade"
placeholder="Cidade (opcional)">

<textarea
id="texto"
placeholder="Escreva sua presença...">

</textarea>

<button
class="btn principal"
onclick="salvarMensagem()">

Compartilhar no site

</button>

<button
class="btn sec"
onclick="compartilharWhats()">

Compartilhar WhatsApp

</button>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";

import {

getDatabase,
ref,
push,
get

}
from
"https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";


const firebaseConfig = {

apiKey:"AIzaSyAd1V6qcGeRmzRjNht8TScYJ5n1Z57Zjws",

authDomain:
"mundo-mais-doce.firebaseapp.com",

databaseURL:
"https://mundo-mais-doce-default-rtdb.firebaseio.com/",

projectId:
"mundo-mais-doce",

storageBucket:
"mundo-mais-doce.firebasestorage.app",

messagingSenderId:
"987943880698",

appId:
"1:987943880698:web:a2fe43a2567de892a00643",

measurementId:
"G-YTBG03LS0W"

};


const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const modal =
document.getElementById("modal");


window.abrirModal=()=>{

modal.style.display="flex";

};

modal.onclick=(e)=>{

if(e.target===modal){

modal.style.display="none";

}

};


window.receberMensagem=
async()=>{

const snap=
await get(
ref(
db,
"presencas"
)
);

if(!snap.exists()){

mensagem.innerHTML=
"Seja a primeira presença 🍫";

return;

}

const lista=

Object.values(
snap.val()
);

const sorteio=

lista[
Math.floor(
Math.random()
*
lista.length
)
];

mensagem.innerHTML=

`"${sorteio.texto}"

<br><br>

✨ ${sorteio.nome || "Alguém"}`;

};


window.salvarMensagem=
async()=>{

const nome=
nome.value.trim();

const cidade=
cidade.value.trim();

const texto=
document
.getElementById("texto")
.value.trim();

if(!texto){

alert(
"Escreva algo 🍫"
);

return;

}

await push(

ref(
db,
"presencas"
),

{

nome,
cidade,
texto,
data:Date.now()

}

);

document
.getElementById("nome")
.value="";

document
.getElementById("cidade")
.value="";

document
.getElementById("texto")
.value="";

modal.style.display=
"none";

receberMensagem();

carregarTotal();

};


window.compartilharWhats=
()=>{

const texto=

document
.getElementById("texto")
.value;

window.open(

"https://wa.me/?text="+

encodeURIComponent(

texto +

"\n\n🍫 Doce Presença"

),

"_blank"

);

};


async function carregarTotal(){

const snap=

await get(
ref(
db,
"presencas"
)
);

if(!snap.exists()){

total.innerText=0;

return;

}

total.innerText=

Object.keys(
snap.val()
).length;

}


receberMensagem();

carregarTotal();

</script>

</body>

</html>
