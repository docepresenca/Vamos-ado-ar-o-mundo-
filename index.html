<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doce Presença</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Montserrat',sans-serif;

background:
linear-gradient(
rgba(20,10,5,.55),
rgba(20,10,5,.65)
),
url("imagem.png");

background-size:cover;
background-position:center;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:12px;

}

.container{

width:100%;

max-width:390px;

padding:22px;

border-radius:28px;

background:
rgba(255,255,255,.10);

backdrop-filter:blur(12px);

color:white;

text-align:center;

}

h1{

font-family:
'Cormorant Garamond',
serif;

font-size:44px;

margin-bottom:12px;

}

.sub{

font-size:14px;

line-height:1.6;

margin-bottom:20px;

}

.card{

background:white;

color:#5b3926;

padding:25px;

border-radius:24px;

}

#mensagem{

font-family:
'Cormorant Garamond',
serif;

font-size:28px;

line-height:1.4;

}

#autor{

margin-top:14px;

font-size:14px;

opacity:.8;

}

.likes{

margin-top:15px;

font-size:14px;

}

.row{

display:flex;

gap:10px;

margin-top:18px;

}

button,
.btn{

width:100%;

padding:14px;

border:none;

border-radius:16px;

font-weight:600;

margin-top:12px;

cursor:pointer;

}

.principal{

background:#e6b46d;

}

.sec{

background:#f3f3f3;

}

.instagram{

display:block;

background:#7a4c31;

color:white;

text-decoration:none;

}

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.75);

justify-content:center;

align-items:center;

padding:20px;

z-index:999;

}

.box{

width:100%;

max-width:360px;

background:#fff8f2;

padding:24px;

border-radius:24px;

color:#5b3926;

}

input,
textarea{

width:100%;

padding:14px;

margin-top:10px;

border-radius:12px;

border:1px solid #ddd;

}

textarea{

height:120px;

resize:none;

}

.preview{

width:92%;

max-width:360px;

border-radius:24px;

}

canvas{

display:none;

}

</style>
</head>

<body>

<div class="container">

<h1>
Nos ajude a adoçar o mundo
</h1>

<div class="sub">
Quando a Doce Presença chega o amargo do mundo vai embora ✨
</div>

<div class="card">

<div id="mensagem">
Carregando...
</div>

<div id="autor"></div>

<div class="likes" id="likes">
❤️ 0 curtidas
</div>

<div class="row">

<button
class="principal"
onclick="curtirMensagem()">

❤️ Curtir

</button>

<button
class="sec"
onclick="gerarImagemMensagemAtual()">

🖼️ Compartilhar

</button>

</div>

<button
class="principal"
onclick="receberMensagem()">

🍯 Adoce seu dia

</button>

<button
class="sec"
onclick="abrirModal()">

🤎 Adoce o dia de alguém

</button>

<a
class="btn instagram"
target="_blank"
href="https://www.instagram.com/doce.presenca.doces?igsh=MWVvcW44bmZ6bXZpdQ==">

✨ Conhecer Instagram

</a>

</div>

</div>


<div class="modal" id="modal">

<div class="box">

<input
id="nome"
placeholder="Nome opcional">

<input
id="cidade"
placeholder="Cidade opcional">

<textarea
id="texto"
placeholder="Escreva sua presença"></textarea>

<button
class="principal"
onclick="salvarMensagem()">

Compartilhar no site

</button>

<button
class="sec"
onclick="compartilharWhats()">

WhatsApp + Arte

</button>

</div>

</div>


<div class="modal" id="previewModal">

<div>

<img
id="previewImg"
class="preview">

<button
class="principal"
onclick="baixarImagem()">

Salvar imagem

</button>

</div>

</div>

<canvas id="canvas"></canvas>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";

import {

getDatabase,
ref,
push,
get,
update

}
from
"https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

const firebaseConfig={

apiKey:"AIzaSyAd1V6qcGeRmzRjNht8TScYJ5n1Z57Zjws",
authDomain:"mundo-mais-doce.firebaseapp.com",
databaseURL:"https://mundo-mais-doce-default-rtdb.firebaseio.com/",
projectId:"mundo-mais-doce",
storageBucket:"mundo-mais-doce.firebasestorage.app",
messagingSenderId:"987943880698",
appId:"1:987943880698:web:a2fe43a2567de892a00643"

};

const app=
initializeApp(firebaseConfig);

const db=
getDatabase(app);

const modal=
document.getElementById("modal");

const previewModal=
document.getElementById("previewModal");

const previewImg=
document.getElementById("previewImg");

let atual={};
let atualId="";
let imgGerada="";

window.abrirModal=()=>{

modal.style.display="flex";

};

modal.onclick=(e)=>{

if(e.target===modal)

modal.style.display="none";

};

previewModal.onclick=(e)=>{

if(e.target===previewModal)

previewModal.style.display="none";

};

window.receberMensagem=
async()=>{

const snap=
await get(
ref(db,"presencas")
);

if(!snap.exists()) return;

const dados=
snap.val();

const keys=
Object.keys(dados);

const key=
keys[
Math.floor(
Math.random()*keys.length
)
];

atualId=key;

atual=dados[key];

document.getElementById("mensagem").innerHTML=

`"${atual.texto}"`;

document.getElementById("autor").innerHTML=

`✨ ${atual.nome || "Alguém"} ${atual.cidade ? " • "+atual.cidade : ""}`;

document.getElementById("likes").innerHTML=

`❤️ ${atual.likes || 0} curtidas`;

};

window.salvarMensagem=
async()=>{

const nome=
document.getElementById("nome").value.trim();

const cidade=
document.getElementById("cidade").value.trim();

const texto=
document.getElementById("texto").value.trim();

if(!texto) return;

await push(

ref(db,"presencas"),

{

nome,
cidade,
texto,
likes:0,
data:Date.now()

}

);

modal.style.display="none";

receberMensagem();

};

window.curtirMensagem=
async()=>{

if(!atualId) return;

const qtd=
(atual.likes||0)+1;

await update(

ref(
db,
"presencas/"+atualId
),

{
likes:qtd
}

);

atual.likes=qtd;

document.getElementById("likes").innerHTML=

`❤️ ${qtd} curtidas`;

};

function gerarArte(texto,nome,cidade){

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

canvas.width=1080;
canvas.height=1920;

const fundo=
new Image();

fundo.src=
"imagem.msg.png";

fundo.onload=()=>{

ctx.drawImage(
fundo,
0,
0,
1080,
1920
);

ctx.fillStyle=
"#4d2d1d";

ctx.font=
"58px serif";

ctx.fillText(
texto,
120,
700
);

ctx.font=
"34px sans-serif";

ctx.fillText(

`${nome || "Alguém"} ${cidade ? "• "+cidade : ""}`,

150,

1300

);

ctx.fillText(

"@doce.presenca.doces",

250,

1500

);

imgGerada=
canvas.toDataURL();

previewImg.src=
imgGerada;

previewModal.style.display=
"flex";

};

}

window.gerarImagemMensagemAtual=
()=>{

gerarArte(

atual.texto || "",

atual.nome || "",

atual.cidade || ""

);

};

window.compartilharWhats=
()=>{

const nome=
document.getElementById("nome").value;

const cidade=
document.getElementById("cidade").value;

const texto=
document.getElementById("texto").value;

gerarArte(
texto,
nome,
cidade
);

};

window.baixarImagem=
()=>{

const a=
document.createElement("a");

a.href=
imgGerada;

a.download=
"doce-presenca.png";

a.click();

window.open(
"https://wa.me"
);

};

receberMensagem();

</script>

</body>
</html>
