<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Doce Presença</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@300;400;600&display=swap"
rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

font-family:
'Montserrat',
sans-serif;

min-height:100vh;

background-image:

linear-gradient(
rgba(20,10,5,.45),
rgba(20,10,5,.55)
),

url("imagem.png");

background-size:cover;

background-position:center;

display:flex;

justify-content:center;

align-items:center;

padding:15px;

overflow:hidden;

}

.container{

width:100%;

max-width:390px;

max-height:95vh;

overflow-y:auto;

padding:24px;

border-radius:28px;

background:

rgba(255,255,255,.10);

backdrop-filter:blur(12px);

box-shadow:

0 10px 35px rgba(0,0,0,.35);

text-align:center;

color:white;

}

.logo{

font-size:15px;

letter-spacing:4px;

opacity:.8;

}

h1{

font-family:
'Cormorant Garamond',
serif;

font-size:48px;

line-height:1;

margin:10px 0;

}

.sub{

line-height:1.6;

margin-bottom:20px;

font-size:14px;

}

.card{

position:relative;

background:

rgba(255,255,255,.95);

border-radius:25px;

padding:24px;

min-height:220px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

color:#5a3625;

margin-bottom:18px;

}

#mensagem{

font-family:
'Cormorant Garamond',
serif;

font-size:28px;

line-height:1.4;

}

.likes{

margin-top:18px;

font-size:14px;

}

.row{

display:flex;

gap:10px;

width:100%;

margin-top:15px;

}

button,
.btn{

width:100%;

padding:15px;

border:none;

border-radius:16px;

margin-top:12px;

font-weight:600;

cursor:pointer;

}

.principal{

background:#e6b46d;

}

.sec{

background:white;

color:#5a3625;

}

.instagram{

display:block;

text-decoration:none;

background:#7a4c31;

color:white;

}

.contador{

margin-top:18px;

font-size:14px;

opacity:.8;

}

/* modal */

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.70);

justify-content:center;

align-items:center;

padding:20px;

z-index:999;

}

.box{

width:100%;

max-width:360px;

background:#fff8f2;

padding:24px;

border-radius:22px;

color:#5a3625;

}

input,
textarea{

width:100%;

padding:14px;

margin-top:10px;

border-radius:12px;

border:1px solid #ddd;

}

textarea{

height:120px;

resize:none;

}

.previewImg{

width:100%;

border-radius:20px;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

DOCE PRESENÇA

</div>

<h1>

Nos ajude a adoçar o mundo

</h1>

<div class="sub">

Quando a Doce Presença chega o amargo do mundo vai embora ✨

</div>

<div
class="card"
onclick="abrirArte()">

<div id="mensagem">

Carregando presença...

</div>

<div
class="likes"
id="likes">

❤️ 0 curtidas

</div>

<div class="row">

<button
class="principal"
onclick="event.stopPropagation();curtirMensagem();">

❤️ Curtir

</button>

<button
class="sec"
onclick="event.stopPropagation();gerarImagem();">

🖼️ Virar imagem

</button>

</div>

</div>

<button
class="principal"
onclick="receberMensagem()">

🍯 Adoce seu dia

</button>

<button
class="sec"
onclick="abrirModal()">

🤎 Adoce o dia de alguém

</button>

<a
class="btn instagram"
target="_blank"
href="https://www.instagram.com/doce.presenca.doces?igsh=MWVvcW44bmZ6bXZpdQ==">

✨ Conhecer nosso Instagram

</a>

<div class="contador">

<span id="total">

0

</span>

presenças espalhadas ✨

</div>

</div>

<!-- modal compartilhar -->

<div
class="modal"
id="modal">

<div class="box">

<input
id="nome"
placeholder="Nome opcional">

<input
id="cidade"
placeholder="Cidade opcional">

<textarea
id="texto"
placeholder="Escreva sua presença">

</textarea>

<button
class="principal"
onclick="salvarMensagem()">

Compartilhar no site

</button>

<button
class="sec"
onclick="compartilharWhats()">

WhatsApp

</button>

</div>

</div>

<!-- modal imagem msg -->

<div
class="modal"
id="arteModal">

<img
src="imagem.msg.png"

style="
width:90%;
max-width:360px;
border-radius:25px;
">

</div>

<!-- modal preview -->

<div
class="modal"
id="previewModal">

<div class="box">

<img
class="previewImg"
id="previewImg">

<button
class="principal"
onclick="baixarImagem()">

Salvar imagem

</button>

</div>

</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";

import {

getDatabase,
ref,
push,
get,
update

}
from
"https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

const firebaseConfig={

apiKey:"AIzaSyAd1V6qcGeRmzRjNht8TScYJ5n1Z57Zjws",
authDomain:"mundo-mais-doce.firebaseapp.com",
databaseURL:"https://mundo-mais-doce-default-rtdb.firebaseio.com/",
projectId:"mundo-mais-doce",
storageBucket:"mundo-mais-doce.firebasestorage.app",
messagingSenderId:"987943880698",
appId:"1:987943880698:web:a2fe43a2567de892a00643"

};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);

let atualId=null;
let atual={};
let imgGerada="";

window.receberMensagem=async()=>{

const snap=
await get(
ref(db,"presencas")
);

if(!snap.exists()){

mensagem.innerHTML=
"Seja a primeira presença 🍫";

return;

}

const obj=snap.val();

const keys=
Object.keys(obj);

const key=
keys[
Math.floor(
Math.random()*keys.length
)
];

atualId=key;

atual=obj[key];

mensagem.innerHTML=

`"${atual.texto}"`;

likes.innerText=

`❤️ ${atual.likes || 0} curtidas`;

};

window.salvarMensagem=
async()=>{

const nome=
document.getElementById("nome").value.trim();

const cidade=
document.getElementById("cidade").value.trim();

const texto=
document.getElementById("texto").value.trim();

if(!texto) return;

await push(

ref(db,"presencas"),

{

nome,
cidade,
texto,
likes:0,
data:Date.now()

}

);

modal.style.display="none";

receberMensagem();

carregarTotal();

};

window.curtirMensagem=
async()=>{

if(!atualId) return;

const qtd=(atual.likes||0)+1;

await update(

ref(
db,
"presencas/"+atualId
),

{likes:qtd}

);

atual.likes=qtd;

likes.innerText=

`❤️ ${qtd} curtidas`;

};

window.compartilharWhats=
()=>{

window.open(

"https://wa.me/?text="+

encodeURIComponent(

texto.value+

"\n🍫 Doce Presença"

)

);

};

window.abrirModal=
()=>modal.style.display="flex";

window.abrirArte=
()=>arteModal.style.display="flex";

arteModal.onclick=
()=>arteModal.style.display="none";

modal.onclick=
(e)=>{

if(e.target===modal)

modal.style.display="none";

};

async function carregarTotal(){

const snap=
await get(ref(db,"presencas"));

total.innerText=

snap.exists()

?

Object.keys(
snap.val()
).length

:

0;

}

receberMensagem();

carregarTotal();

</script>

</body>

</html>
