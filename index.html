<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Doce Presença</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:
linear-gradient(
180deg,
#4b2c20,
#70452d,
#a9744c
);

min-height:100vh;

padding:20px;

display:flex;

justify-content:center;

align-items:center;

color:white;

}

.container{

width:100%;

max-width:430px;

background:
rgba(255,255,255,.10);

backdrop-filter:blur(12px);

padding:25px;

border-radius:28px;

text-align:center;

box-shadow:
0 8px 30px rgba(0,0,0,.35);

}

h1{

font-size:34px;

margin-bottom:12px;

}

.sub{

opacity:.9;

margin-bottom:25px;

line-height:1.5;

}

.card{

background:white;

color:#5d3926;

border-radius:22px;

padding:25px;

min-height:220px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

line-height:1.6;

}

#mensagem{

font-size:20px;

}

.likes{

margin-top:18px;

font-size:15px;

opacity:.8;

}

.row{

display:flex;

gap:10px;

margin-top:15px;

width:100%;

}

.row button{

flex:1;

}

button,
.btn{

width:100%;

padding:15px;

margin-top:12px;

border:none;

border-radius:15px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

.principal{

background:#ffca7a;

}

.sec{

background:white;

color:#5c3a2d;

}

.instagram{

display:block;

text-decoration:none;

background:#8a5737;

color:white;

}

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.6);

justify-content:center;

align-items:center;

padding:20px;

}

.box{

background:white;

width:100%;

max-width:360px;

padding:25px;

border-radius:20px;

color:#5c3a2d;

}

input,
textarea{

width:100%;

padding:12px;

margin-top:10px;

border-radius:12px;

border:1px solid #ddd;

}

textarea{

height:120px;

resize:none;

}

.contador{

margin-top:20px;

opacity:.8;

}

canvas{

display:none;

}

</style>

</head>

<body>

<div class="container">

<h1>

🍫 Nos ajude a adoçar o mundo

</h1>

<div class="sub">

Quando a Doce Presença chega o amargo do mundo vai embora ✨

</div>

<div class="card">

<div id="mensagem">

Carregando presença...

</div>

<div
class="likes"
id="likes">

❤️ 0 curtidas

</div>

<div class="row">

<button
class="principal"
onclick="curtirMensagem()">

❤️ Curtir

</button>

<button
class="sec"
onclick="gerarImagem()">

🖼️ Virar imagem

</button>

</div>

</div>

<button
class="principal"
onclick="receberMensagem()">

🍯 Adoce seu dia

</button>

<button
class="sec"
onclick="abrirModal()">

🤎 Adoce o dia de alguém

</button>

<a
class="btn instagram"
target="_blank"
href="https://www.instagram.com/doce.presenca.doces?igsh=MWVvcW44bmZ6bXZpdQ==">

✨ Conhecer nosso Instagram

</a>

<div class="contador">

<span id="total">

0

</span>

presenças espalhadas ✨

</div>

</div>


<div
class="modal"
id="modal">

<div class="box">

<input
id="nome"
placeholder="Nome opcional">

<input
id="cidade"
placeholder="Cidade opcional">

<textarea
id="texto"
placeholder="Escreva sua presença">

</textarea>

<button
class="principal"
onclick="salvarMensagem()">

Compartilhar no site

</button>

<button
class="sec"
onclick="compartilharWhats()">

WhatsApp

</button>

</div>

</div>

<canvas id="canvas"></canvas>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";

import {

getDatabase,
ref,
push,
get,
update

}
from
"https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";


const firebaseConfig={

apiKey:"AIzaSyAd1V6qcGeRmzRjNht8TScYJ5n1Z57Zjws",
authDomain:"mundo-mais-doce.firebaseapp.com",
databaseURL:"https://mundo-mais-doce-default-rtdb.firebaseio.com/",
projectId:"mundo-mais-doce",
storageBucket:"mundo-mais-doce.firebasestorage.app",
messagingSenderId:"987943880698",
appId:"1:987943880698:web:a2fe43a2567de892a00643"

};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);

let atualId=null;
let atual={};

window.receberMensagem=async()=>{

const snap=
await get(
ref(db,"presencas")
);

if(!snap.exists()) return;

const obj=snap.val();

const keys=
Object.keys(obj);

const key=
keys[
Math.floor(
Math.random()*keys.length
)
];

atualId=key;

atual=obj[key];

mensagem.innerHTML=

`"${atual.texto}"

<br><br>

✨ ${atual.nome || "Alguém"}`;

likes.innerText=

`❤️ ${atual.likes || 0} curtidas`;

};

window.curtirMensagem=
async()=>{

if(!atualId) return;

const qtd=
(atual.likes || 0)+1;

await update(

ref(
db,
"presencas/"+atualId
),

{
likes:qtd
}

);

atual.likes=qtd;

likes.innerText=

`❤️ ${qtd} curtidas`;

};

window.gerarImagem=()=>{

const c=
document.getElementById(
"canvas"
);

const ctx=
c.getContext("2d");

c.width=1080;

c.height=1920;

ctx.fillStyle="#6a4027";

ctx.fillRect(
0,
0,
1080,
1920
);

ctx.fillStyle="#fff5eb";

ctx.fillRect(
80,
350,
920,
900
);

ctx.fillStyle="#5c3a2d";

ctx.font="55px Arial";

wrap(

ctx,

atual.texto || "",

150,

550,

780,

75

);

ctx.font="42px Arial";

ctx.fillText(

"@doce.presenca.doces",

220,

1100

);

const link=
document.createElement("a");

link.download=
"presenca.png";

link.href=
c.toDataURL();

link.click();

};

function wrap(
ctx,
text,
x,
y,
max,
line
){

let words=
text.split(" ");

let str="";

for(let n=0;n<words.length;n++){

let test=
str+
words[n]+" ";

let width=
ctx.measureText(
test
).width;

if(width>max){

ctx.fillText(
str,
x,
y
);

str=
words[n]+" ";

y+=line;

}

else{

str=test;

}

}

ctx.fillText(
str,
x,
y
);

}

window.abrirModal=
()=>{

modal.style.display=
"flex";

};

modal.onclick=
(e)=>{

if(e.target===modal)

modal.style.display=
"none";

};

window.salvarMensagem=
async()=>{

const nome=
document.getElementById(
"nome"
).value;

const cidade=
document.getElementById(
"cidade"
).value;

const texto=
document.getElementById(
"texto"
).value;

if(!texto) return;

await push(

ref(
db,
"presencas"
),

{

nome,
cidade,
texto,
likes:0,
data:Date.now()

}

);

modal.style.display=
"none";

carregarTotal();

};

window.compartilharWhats=
()=>{

const txt=
document.getElementById(
"texto"
).value;

window.open(

"https://wa.me/?text="+

encodeURIComponent(

txt+

"\n\n🍫 Doce Presença"

)

);

};

async function carregarTotal(){

const snap=
await get(
ref(db,"presencas")
);

if(!snap.exists()){

total.innerText=0;

return;

}

total.innerText=

Object.keys(
snap.val()
).length;

}

receberMensagem();

carregarTotal();

</script>

</body>
</html>
