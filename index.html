<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Doce Presença</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@300;400;600&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Montserrat',sans-serif;

min-height:100vh;

background:

linear-gradient(
rgba(20,10,5,.45),
rgba(20,10,5,.60)
),

url("imagem.png");

background-size:cover;

background-position:center;

display:flex;

justify-content:center;

align-items:center;

padding:12px;

}

.container{

width:100%;

max-width:390px;

max-height:96vh;

overflow-y:auto;

padding:22px;

border-radius:28px;

background:
rgba(255,255,255,.10);

backdrop-filter:blur(12px);

color:white;

text-align:center;

}

h1{

font-family:
'Cormorant Garamond',
serif;

font-size:46px;

line-height:1;

margin:10px 0;

}

.sub{

font-size:14px;

line-height:1.6;

margin-bottom:20px;

}

.card{

background:
rgba(255,255,255,.95);

color:#5b3926;

padding:24px;

border-radius:24px;

min-height:230px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

cursor:pointer;

}

#mensagem{

font-family:
'Cormorant Garamond',
serif;

font-size:28px;

line-height:1.4;

}

#autor{

margin-top:18px;

font-size:14px;

opacity:.8;

}

.likes{

margin-top:15px;

font-size:14px;

}

.row{

display:flex;

gap:10px;

width:100%;

margin-top:16px;

}

button,
.btn{

width:100%;

padding:15px;

margin-top:12px;

border:none;

border-radius:16px;

font-weight:600;

cursor:pointer;

}

.principal{

background:#e7b56f;

}

.sec{

background:white;

color:#5b3926;

}

.instagram{

display:block;

background:#7a4c31;

text-decoration:none;

color:white;

}

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.75);

justify-content:center;

align-items:center;

padding:20px;

z-index:999;

}

.box{

width:100%;

max-width:360px;

background:#fff8f2;

padding:24px;

border-radius:24px;

color:#5b3926;

}

input,
textarea{

width:100%;

padding:14px;

margin-top:10px;

border-radius:12px;

border:1px solid #ddd;

}

textarea{

height:120px;

resize:none;

}

.imagemModal{

width:90%;

max-width:360px;

border-radius:24px;

}

.contador{

margin-top:20px;

font-size:14px;

opacity:.8;

}

</style>

</head>

<body>

<div class="container">

<h1>

Nos ajude a adoçar o mundo

</h1>

<div class="sub">

Quando a Doce Presença chega o amargo do mundo vai embora ✨

</div>

<div
class="card"
id="cardMensagem">

<div id="mensagem">

Carregando...

</div>

<div id="autor"></div>

<div
class="likes"
id="likes">

❤️ 0 curtidas

</div>

<div class="row">

<button
class="principal"
onclick="event.stopPropagation();curtirMensagem()">

❤️ Curtir

</button>

<button
class="sec"
onclick="event.stopPropagation();receberMensagem()">

🍯 Outra

</button>

</div>

</div>

<button
class="principal"
onclick="abrirModal()">

🤎 Adoce o dia de alguém

</button>

<a
class="btn instagram"
href="https://www.instagram.com/doce.presenca.doces?igsh=MWVvcW44bmZ6bXZpdQ=="
target="_blank">

✨ Conhecer Instagram

</a>

<div class="contador">

<span id="total">

0

</span>

presenças espalhadas ✨

</div>

</div>


<div
class="modal"
id="modal">

<div class="box">

<input
id="nome"
placeholder="Nome opcional">

<input
id="cidade"
placeholder="Cidade opcional">

<textarea
id="texto"
placeholder="Escreva sua presença"></textarea>

<button
class="principal"
onclick="salvarMensagem()">

Compartilhar

</button>

</div>

</div>


<div
class="modal"
id="arteModal">

<img
src="imagem.msg.png"
class="imagemModal">

</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";

import {

getDatabase,
ref,
push,
get,
update

}
from
"https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";


const firebaseConfig={

apiKey:"AIzaSyAd1V6qcGeRmzRjNht8TScYJ5n1Z57Zjws",
authDomain:"mundo-mais-doce.firebaseapp.com",
databaseURL:"https://mundo-mais-doce-default-rtdb.firebaseio.com/",
projectId:"mundo-mais-doce",
storageBucket:"mundo-mais-doce.firebasestorage.app",
messagingSenderId:"987943880698",
appId:"1:987943880698:web:a2fe43a2567de892a00643"

};

const app=
initializeApp(firebaseConfig);

const db=
getDatabase(app);

let atual={};
let atualId=null;

const modal=
document.getElementById("modal");

const arteModal=
document.getElementById("arteModal");

document
.getElementById("cardMensagem")
.onclick=()=>{

arteModal.style.display="flex";

};

arteModal.onclick=()=>{

arteModal.style.display="none";

};

window.abrirModal=()=>{

modal.style.display="flex";

};

modal.onclick=(e)=>{

if(e.target===modal){

modal.style.display="none";

}

};

window.receberMensagem=
async()=>{

const snap=
await get(
ref(db,"presencas")
);

if(!snap.exists()){

mensagem.innerHTML=
"Seja a primeira presença 🍫";

return;

}

const dados=
snap.val();

const keys=
Object.keys(dados);

const key=
keys[
Math.floor(
Math.random()
*
keys.length
)
];

atualId=key;

atual=dados[key];

document
.getElementById("mensagem")
.innerHTML=

`"${atual.texto}"`;

document
.getElementById("autor")
.innerHTML=

`✨ ${atual.nome || "Alguém"} ${atual.cidade ? "- "+atual.cidade : ""}`;

document
.getElementById("likes")
.innerHTML=

`❤️ ${atual.likes || 0} curtidas`;

};

window.salvarMensagem=
async()=>{

const nome=
document.getElementById("nome").value.trim();

const cidade=
document.getElementById("cidade").value.trim();

const texto=
document.getElementById("texto").value.trim();

if(!texto){

alert("Escreva algo 🍫");

return;

}

await push(

ref(db,"presencas"),

{

nome,
cidade,
texto,
likes:0,
data:Date.now()

}

);

document.getElementById("nome").value="";
document.getElementById("cidade").value="";
document.getElementById("texto").value="";

modal.style.display="none";

receberMensagem();

carregarTotal();

};

window.curtirMensagem=
async()=>{

if(!atualId) return;

const qtd=
(atual.likes||0)+1;

await update(

ref(
db,
"presencas/"+atualId
),

{
likes:qtd
}

);

atual.likes=qtd;

document
.getElementById("likes")
.innerHTML=

`❤️ ${qtd} curtidas`;

};

async function carregarTotal(){

const snap=
await get(
ref(db,"presencas")
);

document
.getElementById("total")
.innerText=

snap.exists()

?

Object.keys(
snap.val()
).length

:

0;

}

receberMensagem();

carregarTotal();

</script>

</body>

</html>
