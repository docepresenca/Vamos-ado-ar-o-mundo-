<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Doce Presença</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Montserrat',sans-serif;

background:
linear-gradient(
rgba(20,10,5,.55),
rgba(20,10,5,.70)
),
url("imagem.png");

background-size:cover;
background-position:center;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:12px;

}

.container{

width:100%;

max-width:390px;

padding:22px;

border-radius:30px;

background:
rgba(255,255,255,.10);

backdrop-filter:blur(14px);

color:white;

text-align:center;

box-shadow:
0 10px 30px rgba(0,0,0,.25);

}

h1{

font-family:
'Cormorant Garamond',
serif;

font-size:44px;

line-height:1;

margin-bottom:12px;

}

.sub{

font-size:14px;

line-height:1.7;

margin-bottom:20px;

opacity:.95;

}

.card{

background:white;

color:#5b3926;

padding:26px;

border-radius:28px;

box-shadow:
0 5px 20px rgba(0,0,0,.12);

}

#mensagem{

font-family:
'Cormorant Garamond',
serif;

font-size:30px;

line-height:1.4;

}

#autor{

margin-top:18px;

font-size:14px;

opacity:.8;

}

.likes{

margin-top:15px;

font-size:14px;

}

.row{

display:flex;

gap:10px;

margin-top:18px;

}

button,
.btn{

width:100%;

padding:15px;

margin-top:12px;

border:none;

border-radius:18px;

font-weight:600;

font-size:15px;

cursor:pointer;

}

.principal{

background:#e6b46d;

color:#4d2d1d;

}

.sec{

background:#f4f4f4;

}

.instagram{

display:block;

background:#7a4c31;

color:white;

text-decoration:none;

}

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.75);

justify-content:center;

align-items:center;

padding:20px;

z-index:999;

}

.box{

width:100%;

max-width:340px;

max-height:85vh;

overflow-y:auto;

background:#fff8f2;

padding:22px;

border-radius:26px;

color:#5b3926;

box-shadow:
0 10px 30px rgba(0,0,0,.25);

}

input,
textarea{

width:100%;

padding:14px;

margin-top:10px;

border-radius:12px;

border:1px solid #ddd;

font-size:16px;

}

textarea{

height:140px;

resize:none;

line-height:1.6;

}

.preview{

width:92%;

max-width:360px;

border-radius:26px;

}

canvas{

display:none;

}

</style>

</head>

<body>

<div class="container">

<h1>
Nos ajude a adoçar o mundo
</h1>

<div class="sub">
Quando a Doce Presença chega o amargo do mundo vai embora ✨
</div>

<div class="card">

<div id="mensagem">
Carregando presença...
</div>

<div id="autor"></div>

<div id="likes" class="likes">
❤️ 0 curtidas
</div>

<div class="row">

<button
class="principal"
onclick="curtirMensagem()">

❤️ Curtir

</button>

<button
class="sec"
onclick="gerarImagemMensagemAtual()">

🖼️ Compartilhar

</button>

</div>

<button
class="principal"
onclick="receberMensagem()">

🍯 Adoce seu dia

</button>

<button
class="sec"
onclick="abrirModal()">

🍫 Adoce o dia de alguém

</button>

<a
class="btn instagram"
target="_blank"
href="https://www.instagram.com/doce.presenca.doces?igsh=MWVvcW44bmZ6bXZpdQ==">

📷 Conhecer nosso Instagram

</a>

</div>

</div>

<div class="modal" id="modal">

<div class="box">

<input
id="nome"
placeholder="Nome opcional">

<input
id="cidade"
placeholder="Cidade opcional">

<textarea
id="texto"
placeholder="Escreva uma presença doce..."></textarea>

<button
class="principal"
onclick="salvarMensagem()">

Salvar no site

</button>

<button
class="sec"
onclick="compartilharWhats()">

WhatsApp + Arte

</button>

</div>

</div>

<div class="modal" id="previewModal">

<div>

<img
id="previewImg"
class="preview">

<button
class="principal"
onclick="baixarImagem()">

Salvar / Compartilhar

</button>

</div>

</div>

<canvas id="canvas"></canvas>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";

import {
getDatabase,
ref,
push,
get,
update
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

const firebaseConfig={

apiKey:"AIzaSyAd1V6qcGeRmzRjNht8TScYJ5n1Z57Zjws",
authDomain:"mundo-mais-doce.firebaseapp.com",
databaseURL:"https://mundo-mais-doce-default-rtdb.firebaseio.com/",
projectId:"mundo-mais-doce",
storageBucket:"mundo-mais-doce.firebasestorage.app",
messagingSenderId:"987943880698",
appId:"1:987943880698:web:a2fe43a2567de892a00643"

};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);

let atual={};
let atualId="";
let imgGerada="";

const modal=document.getElementById("modal");
const previewModal=document.getElementById("previewModal");
const previewImg=document.getElementById("previewImg");

window.abrirModal=()=>{

modal.style.display="flex";

};

modal.onclick=(e)=>{

if(e.target===modal){

modal.style.display="none";

}

};

previewModal.onclick=(e)=>{

if(e.target===previewModal){

previewModal.style.display="none";

}

};

window.receberMensagem=async()=>{

const snap=
await get(
ref(db,"presencas")
);

if(!snap.exists()) return;

const dados=snap.val();

const keys=
Object.keys(dados);

const key=
keys[
Math.floor(
Math.random()*keys.length
)
];

atualId=key;

atual=dados[key];

document.getElementById("mensagem").innerHTML=

`"${atual.texto}"`;

document.getElementById("autor").innerHTML=

`✨ ${atual.nome || "Alguém"} ${atual.cidade ? " • "+atual.cidade : ""}`;

document.getElementById("likes").innerHTML=

`❤️ ${atual.likes || 0} curtidas`;

};

window.salvarMensagem=async()=>{

const nome=document.getElementById("nome").value.trim();

const cidade=document.getElementById("cidade").value.trim();

const texto=document.getElementById("texto").value.trim();

if(!texto) return;

await push(

ref(db,"presencas"),

{
nome,
cidade,
texto,
likes:0,
data:Date.now()
}

);

modal.style.display="none";

receberMensagem();

};

window.curtirMensagem=async()=>{

if(!atualId) return;

const qtd=(atual.likes||0)+1;

await update(

ref(
db,
"presencas/"+atualId
),

{likes:qtd}

);

atual.likes=qtd;

document.getElementById("likes").innerHTML=

`❤️ ${qtd} curtidas`;

};

function wrapText(
ctx,
text,
x,
y,
maxWidth,
lineHeight
){

const words=text.split(" ");

let line="";

for(let n=0;n<words.length;n++){

const test=line+words[n]+" ";

if(

ctx.measureText(test).width>maxWidth

){

ctx.fillText(line,x,y);

line=words[n]+" ";

y+=lineHeight;

}else{

line=test;

}

}

ctx.fillText(line,x,y);

}

function gerarArte(texto,nome,cidade){

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

canvas.width=1080;
canvas.height=1920;

const fundo=new Image();

fundo.src="imagem.msg.png";

fundo.onload=()=>{

ctx.drawImage(
fundo,
0,
0,
1080,
1920
);

ctx.fillStyle="#4b2b1f";

ctx.textAlign="center";

ctx.font="bold 74px serif";

wrapText(
ctx,
texto,
540,
700,
700,
95
);

ctx.font="42px sans-serif";

ctx.fillText(

`${nome || "Alguém"} ${cidade ? "• "+cidade : ""}`,

540,
1320

);

ctx.font="48px sans-serif";

ctx.fillText(

"@doce.presenca.doces",

540,
1520

);

ctx.font="34px sans-serif";

ctx.fillText(

"espalhando presença 🍫",

540,
1600

);

imgGerada=
canvas.toDataURL();

previewImg.src=
imgGerada;

previewModal.style.display=
"flex";

};

}

window.gerarImagemMensagemAtual=
()=>{

gerarArte(

atual.texto || "",

atual.nome || "",

atual.cidade || ""

);

};

window.compartilharWhats=
()=>{

const nome=
document.getElementById("nome").value;

const cidade=
document.getElementById("cidade").value;

const texto=
document.getElementById("texto").value;

gerarArte(
texto,
nome,
cidade
);

};

window.baixarImagem=
()=>{

const a=
document.createElement("a");

a.href=
imgGerada;

a.download=
"doce-presenca.png";

a.click();

window.open(
"https://wa.me"
);

};

receberMensagem();

</script>

</body>
</html>
