<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doce Presença</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  color:#3b2a1a;
  height:100vh;
  overflow:hidden;

  /* 🍯 fundo envolvente */
  background: radial-gradient(circle at top, #fff3db, #f2d0a4, #e6b07a);
}

/* tela cheia */
.container{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  text-align:center;
  padding:30px 20px;
  box-sizing:border-box;
}

/* ✨ FRASE ALEATÓRIA TOPO */
.frase-topo{
  font-style:italic;
  font-size:18px;
  max-width:90%;
  opacity:0.9;
  transition:1s;
}

/* título */
.titulo{
  font-family: "Brush Script MT", cursive;
  font-size:44px;
  margin:10px 0;
}

/* botões estilo presença */
.btn{
  display:inline-block;
  padding:14px 26px;
  border-radius:40px;
  color:white;
  text-decoration:none;
  font-weight:bold;
  margin:8px;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
  transition:0.3s;
  cursor:pointer;
  border:none;
  font-size:15px;
}

.btn:hover{
  transform:scale(1.05);
}

.insta{
  background:linear-gradient(45deg,#8b4513,#d2691e);
}

.acao{
  background:linear-gradient(45deg,#b87333,#e0a96d);
}

.texto-btn{
  display:inline-block;
  margin:8px;
  padding:12px 18px;
  border-radius:30px;
  background:rgba(255,255,255,0.35);
  backdrop-filter: blur(6px);
  cursor:pointer;
  transition:0.3s;
}

.texto-btn:hover{
  transform:scale(1.05);
}

/* modal */
.modal{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#fff7ec;
  padding:25px;
  border-radius:20px;
  width:85%;
  max-width:350px;
  text-align:center;
}

input, textarea{
  width:90%;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

.footer{
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<div class="container">

  <!-- ✨ FRASE ALEATÓRIA -->
  <div class="frase-topo" id="fraseTopo">
    Você está prestes a adoçar o dia de alguém 🍯
  </div>

  <!-- 🍯 TÍTULO -->
  <div>
    <h1 class="titulo">Nos ajude a adoçar o mundo</h1>

    <p style="font-style:italic;">
      "Quando a Doce Presença chega o amargo do mundo vai embora"
    </p>
  </div>

  <!-- 🍯 AÇÕES -->
  <div>

    <a class="texto-btn"
    href="https://wa.me/?text=🍯%20Hoje%20decidi%20adoçar%20meu%20dia.%0A%0Ahttps://docepresenca.github.io/Vamos-ado-ar-o-mundo-/"
    target="_blank">
      🍯 Adoce seu dia
    </a>

    <div class="texto-btn" onclick="abrirModal()">
      🤎 Adoce o dia de alguém
    </div>

  </div>

  <!-- 📸 INSTAGRAM PRINCIPAL -->
  <a class="btn insta"
  href="https://www.instagram.com/doce.presenca.doces?igsh=MWVvcW44bmZ6bXZpdQ=="
  target="_blank">
    ✨ Conhecer nosso Instagram
  </a>

  <div class="footer">
    Doce Presença • pequenos encontros, grandes significados
  </div>

</div>

<!-- 🧁 MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">

    <h3>🤎 Enviar presença</h3>

    <input type="text" id="nome" placeholder="Nome (opcional)">
    <input type="text" id="cidade" placeholder="Cidade (opcional)">
    <textarea id="msg" rows="4" placeholder="Escreva sua mensagem..."></textarea>

    <button class="btn acao" onclick="gerar()">
      📲 gerar envio
    </button>

    <br><br>

    <button onclick="fecharModal()" style="background:none;border:none;">
      fechar ✖
    </button>

  </div>
</div>

<script>

/* 🍯 FRASES ALEATÓRIAS */
const frases = [
  "Hoje pode ser o dia em que alguém sorri por sua causa.",
  "Pequenos gestos carregam grandes presenças.",
  "Você está espalhando algo que não se vê, mas se sente.",
  "Doce também é forma de cuidado.",
  "O simples pode tocar o eterno.",
  "Alguém vai lembrar de você com esse gesto.",
  "Presença também se compartilha."
];

function trocarFrase(){
  const el = document.getElementById("fraseTopo");
  const nova = frases[Math.floor(Math.random() * frases.length)];
  el.innerText = nova;
}

setInterval(trocarFrase, 4000);

/* modal */
function abrirModal(){
  document.getElementById("modal").style.display="flex";
}

function fecharModal(){
  document.getElementById("modal").style.display="none";
}

function gerar(){
  let nome = document.getElementById("nome").value;
  let cidade = document.getElementById("cidade").value;
  let msg = document.getElementById("msg").value;

  let texto =
`🤎 Você recebeu uma presença

${nome ? "De: " + nome : ""}
${cidade ? "Cidade: " + cidade : ""}

"${msg}"

🍯 Doce Presença`;

  let link = "https://wa.me/?text=" + encodeURIComponent(texto);

  window.open(link, "_blank");
}

</script>

</body>
</html>
